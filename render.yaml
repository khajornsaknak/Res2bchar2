services:
  - type: web
    name: res2bchar-ml-api
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODELS_DIR
        value: models
    disk:
      name: models-disk
      mountPath: /opt/render/project/src/models
      sizeGB: 1
